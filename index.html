// ============================================================
// Estos datos ya NO están fijos en el código: se cargan en vivo
// desde datos.json (generado a diario por GitHub Actions).
// Empiezan vacíos y el componente los llena al montar la página.

let LIDERES_BATEO = [];
let LIDERES_HITS = [];
let LIDERES_CARRERAS_ANOTADAS = [];
let PARTIDOS_HOY = [];
let FECHA_DATOS = "";

const NOMBRE_DIVISION = { Este: "Este", Central: "Central", Oeste: "Oeste" };

// Convierte el objeto "lideres" de datos.json (por categoría) a los tres
// arrays con la forma que ya espera el resto del componente.
function aplicarDatosCargados(json) {
  FECHA_DATOS = json.fecha || "";
  PARTIDOS_HOY = json.partidos || [];

  // Actualiza en el lugar los valores de EQUIPOS (no reemplaza la referencia,
  // porque otras partes del archivo ya la usan con `const`).
  if (json.equipos) {
    Object.keys(json.equipos).forEach((cod) => {
      if (EQUIPOS[cod]) Object.assign(EQUIPOS[cod], json.equipos[cod]);
    });
  }

  const l = json.lideres || {};
  const tomar = (cat) => (l[cat] || []).map((x) => ({ jugador: x.jugador, equipo: x.equipo, stat: cat, valor: x.valor }));

  LIDERES_BATEO = [
    ...tomar("AVG").slice(0, 1),
    ...tomar("HR").slice(0, 1),
    ...tomar("RBI").slice(0, 1),
    ...tomar("H").slice(0, 1),
    ...tomar("R").slice(0, 1),
    ...tomar("OPS").slice(0, 1),
    ...tomar("SB").slice(0, 1),
  ];
  LIDERES_HITS = (l.H || []).map((x) => ({ jugador: x.jugador, equipo: x.equipo, valor: x.valor }));
  LIDERES_CARRERAS_ANOTADAS = (l.R || []).map((x) => ({ jugador: x.jugador, equipo: x.equipo, valor: x.valor }));
}

// Calcula la "importancia" de un partido: pelea directa de división,
// cercanía en la tabla (GB), y si ambos están en carrera de comodín
function calcularImportancia(codVis, codLoc) {
  const vis = EQUIPOS[codVis];
  const loc = EQUIPOS[codLoc];
  let puntos = 0;
  const motivos = [];

  const mismaDivision = vis.liga === loc.liga && vis.division === loc.division;
  if (mismaDivision) {
    puntos += 3;
    motivos.push("Rivalidad de división");
  } else if (vis.liga === loc.liga) {
    puntos += 1;
    motivos.push("Mismo liga (pelea por comodín)");
  }

  const pctVis = winPctReal(vis.w, vis.l);
  const pctLoc = winPctReal(loc.w, loc.l);
  const brecha = Math.abs(pctVis - pctLoc);
  if (brecha < 0.03) {
    puntos += 3;
    motivos.push("Equipos prácticamente parejos en el torneo");
  } else if (brecha < 0.07) {
    puntos += 1;
    motivos.push("Diferencia moderada en la tabla");
  }

  // ambos con buen nivel (por encima de .500) suma dramatismo
  if (pctVis > 0.5 && pctLoc > 0.5) {
    puntos += 2;
    motivos.push("Ambos con récord ganador");
  }

  // Alguno peleando el primer puesto de su división
  const primeroVis = Object.entries(EQUIPOS).filter(([, t]) => t.liga === vis.liga && t.division === vis.division)
    .sort((x, y) => winPctReal(y[1].w, y[1].l) - winPctReal(x[1].w, x[1].l))[0][0];
  const primeroLoc = Object.entries(EQUIPOS).filter(([, t]) => t.liga === loc.liga && t.division === loc.division)
    .sort((x, y) => winPctReal(y[1].w, y[1].l) - winPctReal(x[1].w, x[1].l))[0][0];
  if (codVis === primeroVis || codLoc === primeroLoc) {
    puntos += 2;
    motivos.push("Puntero de división en juego");
  }

  let nivel = "Baja";
  if (puntos >= 7) nivel = "Muy alta";
  else if (puntos >= 5) nivel = "Alta";
  else if (puntos >= 3) nivel = "Media";

  return { puntos, nivel, motivos };
}

// ============================================================
// MOTOR DE PREDICCIÓN — Expectativa Pitagórica + Log5
// ============================================================

const EXP_PITAGORICO = 1.83; // exponente estándar validado para MLB

function winPctPitagorico(rs, ra) {
  const rsP = Math.pow(rs, EXP_PITAGORICO);
  const raP = Math.pow(ra, EXP_PITAGORICO);
  return rsP / (rsP + raP);
}

function winPctReal(w, l) {
  return w / (w + l);
}

// Fórmula de Log5 (Bill James) para enfrentamiento directo
function log5(probA, probB) {
  const num = probA - probA * probB;
  const den = probA + probB - 2 * probA * probB;
  return num / den;
}

// Ventaja de localía histórica MLB ~ 54% (fallback si no hay split real del equipo)
const VENTAJA_LOCAL_GENERICA = 0.54;

// Devuelve el % de victorias de un equipo jugando de local, o el genérico si no hay dato
function winPctLocal(equipo) {
  if (equipo.local && (equipo.local.w + equipo.local.l) > 0) {
    return winPctReal(equipo.local.w, equipo.local.l);
  }
  return VENTAJA_LOCAL_GENERICA;
}

// Forma reciente: combina récord de últimos 10 y últimos 20 partidos si están disponibles
function winPctFormaReciente(equipo) {
  const partes = [];
  if (equipo.l10) {
    const [w, l] = String(equipo.l10).split("-").map(Number);
    if (!isNaN(w) && !isNaN(l) && w + l > 0) partes.push({ pct: winPctReal(w, l), peso: 0.6 });
  }
  if (equipo.ultimo20 && (equipo.ultimo20.w + equipo.ultimo20.l) > 0) {
    partes.push({ pct: winPctReal(equipo.ultimo20.w, equipo.ultimo20.l), peso: 0.4 });
  }
  if (partes.length === 0) return null;
  const pesoTotal = partes.reduce((s, p) => s + p.peso, 0);
  return partes.reduce((s, p) => s + p.pct * p.peso, 0) / pesoTotal;
}

function predecir(codA, codB, localEs) {
  const a = EQUIPOS[codA];
  const b = EQUIPOS[codB];

  // Fuerza base de cada equipo: win% real de temporada (35%) + pitagórico (45%) + forma reciente (20% si hay dato)
  const formaA = winPctFormaReciente(a);
  const formaB = winPctFormaReciente(b);

  const probA = formaA !== null
    ? 0.35 * winPctReal(a.w, a.l) + 0.45 * winPctPitagorico(a.rs, a.ra) + 0.20 * formaA
    : 0.4 * winPctReal(a.w, a.l) + 0.6 * winPctPitagorico(a.rs, a.ra);
  const probB = formaB !== null
    ? 0.35 * winPctReal(b.w, b.l) + 0.45 * winPctPitagorico(b.rs, b.ra) + 0.20 * formaB
    : 0.4 * winPctReal(b.w, b.l) + 0.6 * winPctPitagorico(b.rs, b.ra);

  let base = log5(probA, probB);

  // Ajuste de localía: usamos el % real de local/visitante del equipo si está disponible
  // (más preciso que el promedio genérico de la liga), aplicado con log5.
  if (localEs === "A") {
    base = log5(base, winPctLocal(a));
  } else if (localEs === "B") {
    base = 1 - log5(1 - base, winPctLocal(b));
  }

  base = Math.max(0.03, Math.min(0.97, base));

  return {
    probA: base,
    probB: 1 - base,
    pitagoricoA: winPctPitagorico(a.rs, a.ra),
    pitagoricoB: winPctPitagorico(b.rs, b.ra),
    realA: winPctReal(a.w, a.l),
    realB: winPctReal(b.w, b.l),
    formaA, formaB,
  };
}

  const aWins = higherBetter ? valA > valB : valA < valB;

    </div>

// ============================================================
// PUENTE: convierte los JSON crudos de la MLB Stats API (guardados
// por el workflow en datos/partidos.json, datos/standings.json,
// datos/lideres.json) al formato único que aplicarDatosCargados()
// espera: { fecha, partidos, equipos, lideres }.
// ============================================================

// team.id de la MLB Stats API -> código usado en EQUIPOS
const TEAM_ID_A_CODIGO = {
  147: "NYY", 139: "TB", 141: "TOR", 110: "BAL", 111: "BOS",
  114: "CLE", 145: "CHW", 142: "MIN", 116: "DET", 118: "KC",
  136: "SEA", 133: "ATH", 140: "TEX", 117: "HOU", 108: "LAA",
  144: "ATL", 143: "PHI", 146: "MIA", 120: "WSH", 121: "NYM",
  158: "MIL", 138: "STL", 112: "CHC", 134: "PIT", 113: "CIN",
  119: "LAD", 135: "SD", 109: "ARI", 137: "SF", 115: "COL",
};

// Nombre completo de equipo (como viene en partidos.json) -> código
const NOMBRE_A_CODIGO = Object.fromEntries(
  Object.entries(EQUIPOS).map(([cod, t]) => [t.nombre, cod])
);
// Algunos alias por si el nombre viene levemente distinto (ej. "Athletics" vs "Oakland Athletics")
NOMBRE_A_CODIGO["Oakland Athletics"] = "ATH";

function codigoDesdeNombre(nombre) {
  return NOMBRE_A_CODIGO[nombre] || null;
}

// leaderCategory de la API -> clave corta que usa aplicarDatosCargados
const CATEGORIA_API_A_CLAVE = {
  battingAverage: "AVG",
  homeRuns: "HR",
  runsBattedIn: "RBI",
  hits: "H",
  runs: "R",
  onBasePlusSlugging: "OPS",
  stolenBases: "SB",
};

function combinarDatosCrudos({ partidosRaw, standingsRaw, lideresRaw }) {
  const salida = { fecha: new Date().toISOString(), partidos: [], equipos: {}, lideres: {} };

  // --- Partidos ---
  const listaPartidos = Array.isArray(partidosRaw) ? partidosRaw : (partidosRaw?.partidos || []);
  salida.partidos = listaPartidos.map((p) => {
    const codLocal = codigoDesdeNombre(p.local) || p.local;
    const codVisitante = codigoDesdeNombre(p.visitante) || p.visitante;
    let estado = "programado";
    const est = (p.estado || "").toLowerCase();
    if (est.includes("final")) estado = "final";
    else if (est.includes("progress") || est.includes("vivo")) estado = "en_vivo";
    return { ...p, local: codLocal, visitante: codVisitante, estado };
  });

  // --- Standings -> equipos ---
  const records = standingsRaw?.records || [];
  records.forEach((division) => {
    (division.teamRecords || []).forEach((tr) => {
      const cod = TEAM_ID_A_CODIGO[tr.team?.id];
      if (!cod) return;
      const entrada = {
        w: tr.leagueRecord?.wins,
        l: tr.leagueRecord?.losses,
      };
      if (tr.streak?.streakCode) entrada.strk = tr.streak.streakCode;

      const splits = tr.records?.splitRecords || [];
      const home = splits.find((s) => s.type === "home");
      if (home) entrada.local = { w: home.wins, l: home.losses };

      // runsScored/runsAllowed no siempre vienen en standings; si están, los tomamos
      if (typeof tr.runsScored === "number") entrada.rs = tr.runsScored;
      if (typeof tr.runsAllowed === "number") entrada.ra = tr.runsAllowed;

      salida.equipos[cod] = entrada;
    });
  });

  // --- Líderes ---
  const bloques = lideresRaw?.leagueLeaders || [];
  bloques.forEach((bloque) => {
    const clave = CATEGORIA_API_A_CLAVE[bloque.leaderCategory];
    if (!clave) return;
    salida.lideres[clave] = (bloque.leaders || []).map((entry) => ({
      jugador: entry.person?.fullName || "",
      equipo: TEAM_ID_A_CODIGO[entry.team?.id] || "",
      valor: entry.value,
    })).filter((x) => x.jugador && x.equipo);
  });

  return salida;
}

function MLBPredictor() {
  const [teamA, setTeamA] = useState("LAD");
  const [teamB, setTeamB] = useState("ATL");
  const [local, setLocal] = useState("A");
  const [tab, setTab] = useState("hoy");

  // Estado de carga de los datos (generados cada ~10 min por GitHub Actions)
  const [estadoDatos, setEstadoDatos] = useState("cargando"); // "cargando" | "listo" | "error"
  const [errorDatos, setErrorDatos] = useState(null);
  const [tick, setTick] = useState(0); // fuerza re-render tras mutar EQUIPOS/PARTIDOS_HOY

  useEffect(() => {
    let cancelado = false;

    Promise.all([
      fetch("./datos/partidos.json", { cache: "no-store" }).then((r) => {
        if (!r.ok) throw new Error(`datos/partidos.json respondió ${r.status}`);
        return r.json();
      }),
      fetch("./datos/standings.json", { cache: "no-store" }).then((r) => {
        if (!r.ok) throw new Error(`datos/standings.json respondió ${r.status}`);
        return r.json();
      }),
      fetch("./datos/lideres.json", { cache: "no-store" }).then((r) => {
        if (!r.ok) throw new Error(`datos/lideres.json respondió ${r.status}`);
        return r.json();
      }),
    ])
      .then(([partidosRaw, standingsRaw, lideresRaw]) => {
        if (cancelado) return;

              </div>
            </div>

            {/* Resultado de predicción */}
            <div className="rounded-lg border border-[#d4af37]/40 bg-gradient-to-b from-[#123524] to-[#0d2318] p-5">
              <p className="text-[#d4af37] font-bold text-xs tracking-widest uppercase mb-4 flex items-center gap-1"><span>▶</span> Probabilidad de victoria</p>

              <ProbBar label={a.nombre} pct={pred.probA} color="#d4af37" />
              <ProbBar label={b.nombre} pct={pred.probB} color="#7fa88f" />

              <div className="mt-5 pt-4 border-t border-[#1d3a2e] text-xs text-[#c8d9cf] space-y-1.5">
                <p className="text-[#7fa88f] uppercase tracking-wider text-[10px] mb-2">Desglose del modelo</p>
                <div className="flex justify-between"><span>Win% real (temporada) — {a.nombre.split(" ").pop()}</span><span className="font-mono text-[#d4af37]">{(pred.realA*100).toFixed(1)}%</span></div>
                <div className="flex justify-between"><span>Win% real (temporada) — {b.nombre.split(" ").pop()}</span><span className="font-mono text-[#d4af37]">{(pred.realB*100).toFixed(1)}%</span></div>
                <div className="flex justify-between"><span>Win% Pitagórico — {a.nombre.split(" ").pop()}</span><span className="font-mono text-[#d4af37]">{(pred.pitagoricoA*100).toFixed(1)}%</span></div>
                <div className="flex justify-between"><span>Win% Pitagórico — {b.nombre.split(" ").pop()}</span><span className="font-mono text-[#d4af37]">{(pred.pitagoricoB*100).toFixed(1)}%</span></div>
                {pred.formaA !== null && <div className="flex justify-between"><span>Forma reciente (últ. 10-20) — {a.nombre.split(" ").pop()}</span><span className="font-mono text-[#d4af37]">{(pred.formaA*100).toFixed(1)}%</span></div>}
                {pred.formaB !== null && <div className="flex justify-between"><span>Forma reciente (últ. 10-20) — {b.nombre.split(" ").pop()}</span><span className="font-mono text-[#d4af37]">{(pred.formaB*100).toFixed(1)}%</span></div>}
                {local && <div className="flex justify-between pt-1"><span>Ventaja de localía aplicada</span><span className="font-mono text-emerald-400">{((winPctLocal(local === "A" ? a : b) - 0.5) * 100).toFixed(0)}pp al local</span></div>}
              </div>

              <div className="mt-5 bg-[#0a1c12] rounded-lg p-3 text-[11px] text-[#7fa88f] leading-relaxed">
                <p className="font-bold text-[#c8d9cf] mb-1">¿Cómo se calcula?</p>
                <p>1) Se combina el % de victorias real de temporada (35%), la <b>expectativa Pitagórica</b> (45%, exponente 1.83, neutraliza la suerte en partidos ajustados) y la <b>forma reciente</b> ponderada de los últimos 10-20 partidos (20%, cuando el dato está disponible).</p>
                <p className="mt-1">2) Se cruzan ambas fuerzas con la fórmula <b>Log5</b> de Bill James, el estándar sabermétrico para estimar el resultado de un enfrentamiento directo entre dos equipos.</p>
                <p className="mt-1">3) Se aplica la ventaja de localía real del equipo (su propio % de victorias jugando en casa), o el promedio de MLB (~54%) si todavía no hay ese dato cargado.</p>
              </div>
            </div>
          </div>
        )}
      </div>

      <div className="text-center text-[10px] text-[#5a7d6a] py-4">
        Datos de standings: ESPN.com · Líderes de bateo: CBS Sports · Modelo estadístico de referencia, no constituye asesoramiento de apuestas.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MLBPredictor />);
</script>
</body>
</html>
